# Manual instrument for issue #363: the macOS vitest teardown flake.
#
# Runs one slice of the suite in a loop and counts how many attempts hit the
# worker-death signature. Deliberately calls `npx vitest run` directly rather
# than `npm test`, because scripts/test.sh retries on exactly this signature
# and would mask what we are trying to measure.
#
# Measured baseline (issue #363): ~10.2% of macOS root-suite attempts, 0% on
# Linux. At that rate ~40 attempts distinguishes "fixed" from "unchanged".
#
# Each attempt also writes the run ledger scripts/test.sh uses and runs the same
# classifier, so worker deaths that lost test results (a crash mid-file or
# while importing, which test.sh fails on its final attempt) are counted apart
# from the benign ones where every test finished.
name: Flake probe

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which slice to loop
        type: choice
        default: isolated-vm
        options: [isolated-vm, exclude-isolated-vm, full]
      iterations:
        description: Number of attempts
        type: string
        default: '40'
      node-version:
        description: Node major version
        type: string
        default: '26'
      os:
        description: Runner
        type: choice
        default: macos-latest
        options: [macos-latest, ubuntu-latest]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci --foreground-scripts
      - name: Report patch state
        run: |
          echo "isolate dispose-race patch applied: $(grep -c 'await Promise.allSettled(\[runPromise\])' node_modules/@utcp/code-mode/dist/index.js || echo 0)"
      - name: Loop and count worker deaths
        env:
          TARGET: ${{ inputs.target }}
          ITERATIONS: ${{ inputs.iterations }}
          RUNNER_OS_INPUT: ${{ inputs.os }}
          NODE_VERSION_INPUT: ${{ inputs.node-version }}
        run: |
          # NOTE: GitHub runs `run:` steps under `bash -e`. A non-zero vitest
          # exit -- the very event this loop exists to count -- would abort the
          # step, so every vitest invocation is wrapped in an `if` (exempt from
          # errexit) and its status captured explicitly.
          set -uo pipefail
          ISOLATED_VM_FILES="test/workflow-policy-cycling.integration.test.ts test/help-integration.test.ts test/docker-code-mode.integration.test.ts test/sandbox-tool-errors.integration.test.ts"
          case "$TARGET" in
            isolated-vm)         ARGS="$ISOLATED_VM_FILES" ;;
            exclude-isolated-vm) ARGS=""; for f in $ISOLATED_VM_FILES; do ARGS="$ARGS --exclude $f"; done ;;
            full)                ARGS="" ;;
            *)                   echo "::error::unknown target $TARGET"; exit 1 ;;
          esac
          if ! printf '%s' "$ITERATIONS" | grep -Eq '^[0-9]+$'; then
            echo "::error::iterations must be a number, got '$ITERATIONS'"
            exit 1
          fi
          SIG='Worker exited unexpectedly|prevents Vite server from exiting|close timed out after [0-9]+ms'
          hits=0; lost=0; testfails=0; other=0; n=$ITERATIONS
          for i in $(seq 1 "$n"); do
            log="$RUNNER_TEMP/attempt-$i.log"
            ledger="$RUNNER_TEMP/attempt-$i.ledger.json"
            if IC_VITEST_LEDGER="$ledger" npx vitest run --reporter=default --reporter=./scripts/vitest-run-ledger.ts $ARGS >"$log" 2>&1; then ec=0; else ec=$?; fi
            out="$(perl -pe 's/\x1b\[[0-9;]*m//g' "$log")"
            verdict=pass
            if [ "$ec" -ne 0 ]; then
              verdict="$(npx tsx scripts/classify-vitest-run.ts --exit-code "$ec" --ledger "$ledger" --log "$log" 2>/dev/null)" || verdict=fail
            fi
            tag="ok"
            if printf '%s\n' "$out" | grep -qE "$SIG"; then
              hits=$((hits+1)); tag="WORKER-DEATH"
              if [ "$verdict" = incomplete ]; then
                lost=$((lost+1)); tag="WORKER-DEATH-LOST-RESULTS"
              fi
              echo "::warning::attempt $i/$n: worker death ($verdict)"
              printf '%s\n' "$out" | grep -E "$SIG" | head -2
            elif printf '%s\n' "$out" | grep -qE '(Test Files|Tests)[[:space:]]+[0-9]+ failed'; then
              testfails=$((testfails+1)); tag="TEST-FAILURE"
              echo "::warning::attempt $i/$n: real test failure"
              printf '%s\n' "$out" | grep -E "^ *FAIL " | head -5
            elif [ "$ec" -ne 0 ]; then
              other=$((other+1)); tag="OTHER-NONZERO(ec=$ec)"
              printf '%s\n' "$out" | tail -15
            fi
            summary="$(printf '%s\n' "$out" | grep -E '^ *(Test Files|Tests) ' | tr '\n' ' ' | sed 's/  */ /g')"
            echo "attempt $i/$n [$tag] ec=$ec verdict=$verdict | $summary"
            echo "  running totals: worker-deaths=$hits (lost-results=$lost) test-failures=$testfails other=$other"
          done
          {
            echo "### Flake probe result"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| target | $TARGET |"
            echo "| runner / node | $RUNNER_OS_INPUT / $NODE_VERSION_INPUT |"
            echo "| attempts | $n |"
            echo "| worker deaths | $hits |"
            echo "| worker deaths that lost test results | $lost |"
            echo "| real test failures | $testfails |"
            echo "| other non-zero exits | $other |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "RESULT worker-deaths=$hits lost-results=$lost test-failures=$testfails other=$other out of $n attempts"
